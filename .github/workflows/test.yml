name: Test & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start API server
        run: npm start &
        env:
          NODE_ENV: test

      - name: Wait for API to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000/health; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... (attempt $i/30)"
            sleep 1
          done
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Create test results directory
        run: mkdir -p results

      - name: Run API tests
        run: npm run test:api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: results/

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Check for console.error/warn (code smell)
        run: |
          if grep -r "console\.error\|console\.warn" server.js; then
            echo "Warning: Found console.error/warn statements"
          fi

      - name: Validate JSON files
        run: find . -name "*.json" -not -path "./node_modules/*" | xargs -I {} bash -c 'python -m json.tool {} > /dev/null'

  test-report:
    name: Generate Test Report
    needs: api-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-test-results
          path: results/

      - name: Display test results
        run: |
          echo "=== Test Execution Summary ==="
          ls -la results/
          if [ -f results/api-results.xml ]; then
            echo "Test results available in artifacts"
          fi